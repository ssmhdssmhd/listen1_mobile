name: Build Android APK

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # sdkmanager（cmdline-tools latest）需要 Java 17
      - name: Set up JDK 17 for Android SDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "platforms;android-28" "build-tools;28.0.3"

      # RN 0.59 + Gradle 5.4.1 只兼容 Java 8
      - name: Set up JDK 8 for Gradle
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Set up Node.js 12
        uses: actions/setup-node@v4
        with:
          node-version: '12.22.12'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile --network-timeout 600000

      - name: Read version
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          BUILD_TIME=$(TZ=Asia/Shanghai date +'%Y%m%d%H%M')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "build_time=$BUILD_TIME" >> "$GITHUB_OUTPUT"
          echo "APK 版本 v$VERSION / 构建时间 $BUILD_TIME"

      - name: Restore signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::缺少仓库 Secret KEYSTORE_BASE64，无法签名打包"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/my-release-key.keystore

      - name: Build release APK
        env:
          ORG_GRADLE_PROJECT_MYAPP_UPLOAD_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          ORG_GRADLE_PROJECT_MYAPP_UPLOAD_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Verify APK signature
        run: |
          "$ANDROID_HOME/build-tools/28.0.3/apksigner" verify --verbose \
            android/app/build/outputs/apk/release/app-release.apk

      - name: Rename APK
        id: apk
        run: |
          OUT="Listen1.${{ steps.version.outputs.version }}.${{ steps.version.outputs.build_time }}.apk"
          cp android/app/build/outputs/apk/release/app-release.apk "$OUT"
          echo "path=$OUT" >> "$GITHUB_OUTPUT"
          echo "生成 $OUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Listen1-${{ steps.version.outputs.version }}
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error

      - name: Publish GitHub Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}-${{ github.run_number }}
          name: Listen1 v${{ steps.version.outputs.version }} (${{ steps.version.outputs.build_time }})
          files: ${{ steps.apk.outputs.path }}
          body: |
            ## Listen1 v${{ steps.version.outputs.version }}

            - 构建方式：GitHub Actions 云端编译
            - 构建时间：${{ steps.version.outputs.build_time }}（Asia/Shanghai）
            - 提交：${{ github.sha }}

            下载下方的 `Listen1.${{ steps.version.outputs.version }}.${{ steps.version.outputs.build_time }}.apk` 安装即可。

rootProject.name = 'Listen1'

// jcenter 已停止服务：将各级工程中声明的 jcenter 自动重定向到阿里云镜像
gradle.allprojects { project ->
    def redirectJcenter = { repos ->
        repos.whenObjectAdded { repo ->
            if (repo instanceof org.gradle.api.artifacts.repositories.MavenArtifactRepository &&
                    repo.url.toString().contains('jcenter')) {
                repo.url = 'https://maven.aliyun.com/repository/jcenter'
            }
        }
    }
    redirectJcenter(project.buildscript.repositories)
    redirectJcenter(project.repositories)
}

include ':@react-native-community_async-storage'
project(':@react-native-community_async-storage').projectDir = new File(rootProject.projectDir, '../node_modules/@react-native-community/async-storage/android')
include ':react-native-music-control'
project(':react-native-music-control').projectDir = new File(rootProject.projectDir, '../node_modules/react-native-music-control/android')
include ':react-native-vector-icons'
project(':react-native-vector-icons').projectDir = new File(rootProject.projectDir, '../node_modules/react-native-vector-icons/android')
include ':react-native-gesture-handler'
project(':react-native-gesture-handler').projectDir = new File(rootProject.projectDir, '../node_modules/react-native-gesture-handler/android')
include ':react-native-video'
project(':react-native-video').projectDir = new File(rootProject.projectDir, '../node_modules/react-native-video/android-exoplayer')

include ':app'
